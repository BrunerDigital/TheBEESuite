name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run production validation gate
        run: npm run cloud:validate

      - name: Verify cron and migration manifests
        run: npm run ops:check

      - name: Verify billing interactions and public registration privacy
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          google-chrome --version
          node --import tsx --test tests/billing-check-draft.browser.ts tests/offline-payment-recovery.browser.ts tests/public-registration-privacy.browser.ts

  payments-browser:
    if: github.head_ref == 'ci/payments-readonly-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify installed Chrome
        run: google-chrome --version
      - name: Verify read-only Payments fixtures
        run: |
          set +e
          node --import tsx --test tests/school-payments-readonly.browser.ts tests/school-payments-readonly-integration.browser.ts 2>&1 | tee "$RUNNER_TEMP/bee-payments-fixtures.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(grep -m 3 -E 'not ok|^ *error:|^ *code:|^ *name:|Error:|TimeoutError:' "$RUNNER_TEMP/bee-payments-fixtures.log" | tr '\n' ' ' | cut -c1-450)
            echo "::error title=Payments browser checks::${detail:-Browser fixture command failed.}"
            exit "$status"
          fi

  tuition-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify recurring tuition saves in Chrome
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: node --import tsx scripts/qa-tuition-save.ts

# manual trigger for required validate status
