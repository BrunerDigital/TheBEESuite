<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>BEE Suite Parent Portal</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05070a;
        color: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: calc(28px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      }

      main {
        width: min(100%, 420px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.1;
      }

      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        margin-bottom: 28px;
        place-items: center;
        border-radius: 20px;
        background: #ffcf40;
        color: #111111;
        font-size: 34px;
        font-weight: 900;
      }

      .role {
        margin-bottom: 12px;
        color: #ffcf40;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      p {
        margin: 0 0 20px;
        color: #cbd5e1;
        font-size: 15px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #f5b51b;
        color: #101318;
        font-weight: 700;
        padding: 0 18px;
        text-decoration: none;
      }

      a:focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">B</div>
      <div class="role">Parent Portal</div>
      <h1>Welcome to BEE Suite</h1>
      <p>Connecting you to your secure family workspace.</p>
      <a href="https://thebeesuite.io/parents">Open parent portal</a>
    </main>
  </body>
</html>
