name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run production validation gate
        run: npm run cloud:validate

      - name: Verify cron and migration manifests
        run: npm run ops:check

      - name: Verify billing drafts, documents and offline payment recovery
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          google-chrome --version
          node --import tsx --test tests/billing-check-draft.browser.ts tests/offline-payment-recovery.browser.ts

  tuition-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify recurring tuition saves in Chrome
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: node --import tsx scripts/qa-tuition-save.ts

# manual trigger for required validate status
